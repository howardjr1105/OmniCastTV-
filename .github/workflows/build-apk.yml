name: Compilar APK OmniCast TV

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Aceptar licencias de Android SDK (Preinstalado en el Runner)
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Configurar Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: Compilar APK Debug y Release (Pre-firmado para Google TV)
        run: |
          # Si subiste los archivos dentro de la subcarpeta OmniCastTV, entra a ella automáticamente:
          if [ -f "OmniCastTV/settings.gradle.kts" ]; then cd OmniCastTV; fi
          gradle assembleDebug assembleRelease

      - name: Subir APK listo para instalar en Google TV / Android TV
        uses: actions/upload-artifact@v4
        with:
          name: OmniCastTV-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
