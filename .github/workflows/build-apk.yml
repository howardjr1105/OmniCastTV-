name: Compilar y Publicar Release APK OmniCast TV

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

# Permiso indispensable para que GitHub Actions pueda crear Releases y adjuntar el APK
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Aceptar licencias de Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Configurar Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: Compilar APK Release y Debug (Pre-firmados para Google TV)
        run: |
          if [ -f "OmniCastTV/settings.gradle.kts" ]; then cd OmniCastTV; fi
          gradle assembleRelease assembleDebug

          # Copiar y renombrar los APK en la raíz del workspace para su publicación
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/OmniCastTV.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/OmniCastTV-debug.apk"

      - name: Subir APK como Artefacto del Action
        uses: actions/upload-artifact@v4
        with:
          name: OmniCastTV-Native-APK
          path: |
            ${{ github.workspace }}/OmniCastTV.apk
            ${{ github.workspace }}/OmniCastTV-debug.apk

      - name: Publicar APK en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "OmniCast Native TV v2.0.${{ github.run_number }}"
          body: |
            ### 📺 OmniCast Native TV (Google TV / Android TV)
            * **Motor 100% Nativo por Hardware (`SurfaceView` + `MediaCodec` H.264 Low-Latency)**
            * **Protocolos activos:** AirPlay (`_airplay._tcp` :7000), DLNA/UPnP (`SSDP` :1900) y Stream Binario H.264 (`:8080` / `:8444`).
            * **Instalación directa en TV:** Descarga el archivo `OmniCastTV.apk` adjunto en esta versión.
          draft: false
          prerelease: false
          make_latest: "true"
          files: |
            ${{ github.workspace }}/OmniCastTV.apk
            ${{ github.workspace }}/OmniCastTV-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
